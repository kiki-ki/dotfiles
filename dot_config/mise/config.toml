[settings]
disable_backends = ["asdf", "vfox"]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
minimum_release_age = "3d"
npm.package_manager = "pnpm"

[tools]
go = "latest"
node = "latest"
pnpm = "latest"
python = "latest"

"npm:pyright" = "latest"
"npm:textlint" = "latest"
"go:golang.org/x/tools/gopls" = "latest"

"aqua:starship/starship" = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:cli/cli" = "latest"
"aqua:charmbracelet/gum" = "latest"
"aqua:direnv/direnv" = "latest"
"aqua:gitleaks/gitleaks" = "latest"
"aqua:herdrdev/herdr" = "latest"
"aqua:rossmacarthur/sheldon" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:neovim/neovim" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:modem-dev/hunk" = "latest"
"aqua:sharkdp/bat" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:aws/aws-cli" = "latest"
"aqua:astral-sh/uv" = "latest"

"github:seachicken/gh-poi" = { version = "latest", bin = "gh-poi" }
"github:kiki-ki/go-qo" = "latest"
