# Shared config for every repository, wired in through init.templateDir.
# repo: local keeps the gitleaks version owned by mise.lock instead of a rev
# pinned here, and needs no clone of the upstream hook repository.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: gitleaks git --staged --redact --verbose
        language: system
        pass_filenames: false
